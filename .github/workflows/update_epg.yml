name: Auto Update Demo EPG

on:
  schedule:
    # Runs automatically every night at midnight UTC
    - cron: '0 0 * * *'
  # Allows you to manually trigger it anytime from GitHub's "Actions" tab
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Fresh 7-Day EPG
        run: python generate_epg.py

      - name: Commit and push updated EPG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add demo_epg.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-refresh 7-day EPG schedule [skip ci]" && git push)
